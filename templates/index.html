<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f5f6fa 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
        }
        .text-white {
            color: #222;
            font-size: 1.45rem;
        }
        .sidebar-3d {
            position: fixed;
            left: 0;
            top: 0;
            width: 210px;
            height: 100vh;
            background: #fff;
            border-radius: 0 24px 24px 0;
            box-shadow: 4px 0 24px rgba(226,133,195,0.15);
            padding: 2rem 1rem 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            z-index: 10;
            transition: transform 0.3s, box-shadow 0.3s, left 0.3s;
            will-change: transform;
        }
        .sidebar-3d.hide {
            left: -230px;
        }
        .sidebar-3d h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #e285c3;
            margin-bottom: 1.2rem;
        }
        .sidebar-3d a {
            color: #222;
            text-decoration: none;
            font-size: 1.45rem;
            margin-bottom: 1.2rem;
            display: block;
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s, font-size 0.2s;
            font-weight: bold;
        }
        .sidebar-3d a.dashboard-link {
            background: #e285c3;
            color: #fff;
            pointer-events: none;
            cursor: default;
        }
        .sidebar-3d a:hover:not(.dashboard-link),
        .sidebar-3d a.active:not(.dashboard-link) {
            background: #e285c3;
            color: #fff;
        }
        .sidebar-toggle-btn {
            position: fixed;
            top: 24px;
            left: 220px;
            z-index: 20;
            background: #e285c3;
            color: #fff;
            border: none;
            border-radius: 0 8px 8px 0;
            padding: 10px 18px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 2px 2px 8px #e285c344;
            transition: left 0.3s;
        }
        .sidebar-3d.hide + .sidebar-toggle-btn {
            left: 0;
        }
        .main-content-3d {
            margin-left: 230px;
            padding: 2rem 1rem 2rem 1rem;
            transition: margin-left 0.3s;
        }
        .sidebar-3d.hide ~ .main-content-3d {
            margin-left: 30px;
        }
        .card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(226,133,195,0.13), 0 2px 8px 0 rgba(0,0,0,0.10);
            padding: 1.2rem 1rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 
                transform 0.35s cubic-bezier(.25,.8,.25,1), 
                box-shadow 0.35s;
            will-change: transform;
            perspective: 800px;
            cursor: pointer;
            min-height: 420px;
        }
        .card:hover {
            transform: rotateY(10deg) scale(1.06) translateY(-8px);
            box-shadow: 0 24px 64px 0 rgba(226,133,195,0.22), 0 8px 32px 0 rgba(0,0,0,0.14);
            z-index: 2;
        }
        .card-img-top {
            width: 140px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 16px #e285c344;
            margin-bottom: 1.1rem;
            background: #e0e7ff;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        .card:hover .card-img-top {
            box-shadow: 0 8px 32px #e285c344;
            transform: scale(1.05) rotateY(6deg);
        }
        @media (max-width: 900px) {
            .sidebar-3d, .sidebar-toggle-btn { display: none; }
            .main-content-3d { margin-left: 0; }
        }
    </style>
</head>
<body>
    <!-- 3D Sidebar -->
    <nav class="sidebar-3d" id="sidebar3d">
        <h3>Navigation</h3>
        <a href="/" class="active">🏠 Home</a>
        <a href="/recommend">✨ Recommend</a>
        <a href="/dashboard" >📊 Dashboard</a>
        <a href="/contact">📞 Contact</a>
    </nav>
    <button class="sidebar-toggle-btn" id="sidebarToggle" title="Toggle Sidebar">&#9776;</button>

    <div class="main-content-3d" id="mainContent3d">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <h1 class="text-white" style="font-size:2.5em">Top 50 Books</h1>
                </div>
                {% for i in range(book_name|length) %}
                    <div class="col-md-3" style="margin-top:50px">
                        <div class="card">
                            <div class="card-body">
                                <img class="card-img-top" src="{{ image[i] }}">
                                <p class="text-white">{{ book_name[i] }}</p>
                                <h4 class="text-white">{{ author[i] }}</h4>
                                <h4 class="text-white">Votes - {{ votes[i] }}</h4>
                                <h4 class="text-white">Rating - {{ rating[i] }}</h4>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
    <script>
        const sidebar = document.getElementById('sidebar3d');
        const toggleBtn = document.getElementById('sidebarToggle');
        const mainContent = document.getElementById('mainContent3d');
        let sidebarHidden = false;
        toggleBtn.onclick = function() {
            sidebarHidden = !sidebarHidden;
            if(sidebarHidden) {
                sidebar.classList.add('hide');
                mainContent.style.marginLeft = "30px";
                toggleBtn.style.left = "0";
            } else {
                sidebar.classList.remove('hide');
                mainContent.style.marginLeft = "230px";
                toggleBtn.style.left = "220px";
            }
        }
    </script>
</body>
</html>
