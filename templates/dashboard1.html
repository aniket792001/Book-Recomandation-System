<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .card { transition: box-shadow 0.2s; }
        .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .search-results { max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Book Recommender</a>
        </div>
    </nav>
    <div class="container">
        <h2 class="mb-4">Dashboard</h2>
        <div class="row mb-4">
            <div class="col-md-6">
                <form id="searchForm" class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search for a book..." id="searchInput" autocomplete="off">
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
                <div id="searchResults" class="search-results mt-2"></div>
            </div>
            <div class="col-md-6">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Total Books</h5>
                        <p class="card-text" id="totalBooks">--</p>
                    </div>
                </div>
                <div class="card text-white bg-success mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Total Users</h5>
                        <p class="card-text" id="totalUsers">--</p>
                    </div>
                </div>
            </div>
        </div>
        <h4>Top Recommendations</h4>
        <div class="row" id="recommendations">
            <!-- Book cards will be injected here -->
        </div>
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Dummy data for demonstration
        const books = [
            { title: "The Great Gatsby", author: "F. Scott Fitzgerald", cover: "https://covers.openlibrary.org/b/id/7222246-L.jpg" },
            { title: "1984", author: "George Orwell", cover: "https://covers.openlibrary.org/b/id/7222246-L.jpg" },
            { title: "To Kill a Mockingbird", author: "Harper Lee", cover: "https://covers.openlibrary.org/b/id/7222246-L.jpg" },
            { title: "Pride and Prejudice", author: "Jane Austen", cover: "https://covers.openlibrary.org/b/id/7222246-L.jpg" },
            { title: "The Hobbit", author: "J.R.R. Tolkien", cover: "https://covers.openlibrary.org/b/id/7222246-L.jpg" }
        ];
        document.getElementById('totalBooks').textContent = books.length;
        document.getElementById('totalUsers').textContent = 1234;

        // Render recommendations
        function renderRecommendations() {
            const container = document.getElementById('recommendations');
            container.innerHTML = '';
            books.forEach(book => {
                container.innerHTML += `
                    <div class="col-md-3 mb-4">
                        <div class="card h-100">
                            <img src="${book.cover}" class="card-img-top" alt="${book.title}">
                            <div class="card-body">
                                <h5 class="card-title">${book.title}</h5>
                                <p class="card-text">${book.author}</p>
                                <button class="btn btn-outline-primary btn-sm">Recommend</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        renderRecommendations();

        // Search functionality
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.toLowerCase();
            const results = books.filter(book => book.title.toLowerCase().includes(query));
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';
            if (results.length === 0) {
                resultsDiv.innerHTML = '<div class="alert alert-warning">No books found.</div>';
            } else {
                results.forEach(book => {
                    resultsDiv.innerHTML += `
                        <div class="card mb-2">
                            <div class="card-body d-flex align-items-center">
                                <img src="${book.cover}" alt="${book.title}" width="40" class="me-3">
                                <div>
                                    <strong>${book.title}</strong><br>
                                    <small>${book.author}</small>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
