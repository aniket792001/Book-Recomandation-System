<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Book Recommender System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background: #f5f6fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #fff;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 2rem;
            color: #222;
            font-size: 2rem;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 1.4rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input[type="email"],
        .input-wrapper input[type="password"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            background: #fffecb;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: box-shadow 0.2s, background 0.2s;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 0;
            height: 44px;
        }
        .input-wrapper input[type="email"]:focus,
        .input-wrapper input[type="password"]:focus {
            background: #e0e7ff;
            box-shadow: 0 4px 16px rgba(0,123,255,0.10);
        }
        /* Email icon styling */
        /* .input-wrapper .email-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 1.2rem;
            pointer-events: none;
            transition: color 0.2s;
        } */
        /* .input-wrapper input[type="email"]:focus + .email-icon {
            color: #007bff;
        } */
        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        .login-btn:hover {
            background: #0056b3;
        }
        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 1rem;
        }
        .form-footer a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form method="POST" action="/login" autocomplete="off">
            {{ form.hidden_tag() }}
            <div class="form-group input-wrapper">
                {{ form.email.label }}
                {{ form.email(id="email") }}
            </div>
            <div class="form-group input-wrapper">
                {{ form.password.label }}
                {{ form.password(id="password") }}
            </div>
            {{ form.submit(class_="login-btn") }}
        </form>
        <div class="form-footer">
            Don't have an account? <a href="/register">Register</a>
        </div>
    </div>
</body>
</html>
