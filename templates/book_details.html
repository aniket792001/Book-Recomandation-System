<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ book.title }} - Details</title>
    <style>
        body { background: #f5f6fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .detail-container {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(37,99,235,0.12);
            width: 400px;
            margin: 60px auto;
            padding: 2rem;
            text-align: center;
        }
        .book-cover {
            width: 120px;
            height: 170px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 16px #2563eb22;
            margin-bottom: 1.1rem;
            background: #e0e7ff;
        }
        .book-title { font-size: 1.5rem; font-weight: 700; color: #1e40af; margin-bottom: 0.5rem; }
        .book-author { font-size: 1.1rem; color: #555; margin-bottom: 1rem; }
        .book-desc { font-size: 1rem; color: #444; margin-bottom: 1.2rem; }
        .back-link { display: inline-block; margin-top: 1.2rem; color: #2563eb; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="detail-container">
        <img class="book-cover" src="{{ book.cover_url }}" alt="Book Cover">
        <div class="book-title">{{ book.title }}</div>
        <div class="book-author">by {{ book.author }}</div>
        <div class="book-desc">{{ book.description }}</div>
        <a class="back-link" href="{{ url_for('index') }}">← Back to Library</a>
    </div>
</body>
</html>
